# Construit l'APK Android (version de test, installable directement) à chaque push sur main ou dev.
# Le fichier se télécharge dans l'onglet Actions → la dernière exécution → « Artifacts ».
#
# Variables à définir dans GitHub : Settings → Secrets and variables → Actions → onglet Variables
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (mêmes valeurs que sur Vercel)
#   VITE_SITE_URL (facultatif, par défaut https://cardlearn.vercel.app)
name: APK Android

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'appli web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Variables Supabase absentes : l'APK fonctionnera en mode local, sans connexion."
          fi
          npm run build

      - name: Copier l'appli dans le projet Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CardLearn-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
